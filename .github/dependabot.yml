version: 2
updates:
  # Enable version updates for Python/pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "MementoRC"
    assignees:
      - "MementoRC"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "ruff"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy*"
          - "pre-commit*"
          - "bandit*"
          - "safety*"
          - "coverage*"
          - "aioresponses*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "aiohttp*"
          - "pydantic*"
        update-types:
          - "patch"

  # Existing GitHub Actions entry (drives ci-framework workflow bump PRs), unchanged
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
