[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-market-data"
dynamic = ["version"]
description = "Live market data adapter for Hummingbot — implements MarketDataProtocol from hb-strategy-framework"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pandas>=2",
    "hb-data-type-primitives>=0.3,<0.4",
]

# market-data satisfies hb-strategy-framework's MarketDataProtocol structurally and does
# not import it; the shared primitives come from hb-data-type-primitives (ADR 0001, L2 -> L0).

[tool.hatch.version]
path = "market_data/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["market_data"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
pydantic = ">=2"
pandas = ">=2"

[tool.pixi.pypi-dependencies]
hb-data-type-primitives = { git = "https://github.com/MementoRC/hb-data-type-primitives.git", tag = "v0.3.0" }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.17.2"
mypy = ">=1.20.0"
import-linter = ">=2.0"
pre-commit = ">=2.15.0"
bandit = ">=1.8.0"
pip-audit = "*"
filelock = "*"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.17.2"
mypy = ">=1.5.1"
import-linter = ">=2.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
bandit = ">=1.8.0"
pip-audit = "*"
filelock = "*"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
coverage = "pytest tests/ --cov=market_data --cov-report=term-missing"
lint = "ruff check market_data tests"
format = "ruff format market_data tests"
format-check = "ruff format --check market_data tests"
typecheck = "mypy market_data"
build = "hatchling build"
check-conda-first = "python scripts/check_conda_first.py"
lint-boundaries = "lint-imports"
bandit-security = "bandit -c pyproject.toml -r market_data --severity-level medium --confidence-level medium"
safety-check = "pip-audit --skip-editable"
quality = { depends-on = ["check-conda-first", "lint", "format-check", "typecheck", "lint-boundaries", "bandit-security"] }
check = { depends-on = ["check-conda-first", "quality", "coverage"] }

[tool.importlinter]
root_package = "market_data"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "market_data never imports hummingbot (ADR 0001)"
type = "forbidden"
source_modules = ["market_data"]
forbidden_modules = ["hummingbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["market_data"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["market_data"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", ".pixi", ".worktrees"]

[tool.coverage.run]
branch = true
source_pkgs = ["market_data"]
omit = ["market_data/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

# Scope: only the order-book / price snapshot surface of MarketDataProvider, not all of
# hummingbot.data_feed.
[tool.hummingbot.supersedes]
module = "hummingbot.data_feed.market_data_provider"
import_path = "market_data"
test_paths = []
